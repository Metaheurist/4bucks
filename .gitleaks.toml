# Gitleaks configuration for CI (see .github/workflows/ci.yml).
# Working-tree scan with --no-git so old commits are not re-flagged.

title = "4Bucks"

[extend]
useDefault = true

[allowlist]
description = "README/docs badges and examples; local venvs, build outputs, caches"
paths = [
  '''^README\.md$''',
  '''^CHANGELOG\.md$''',
  '''^docs/''',
  '''^\.venv/''',
  '''^\.venv-x86/''',
  '''^venv/''',
  '''^ENV/''',
  '''^dist/''',
  '''^build/''',
  '''^backups/''',
  '''^\.pytest_cache/''',
  '''^__pycache__/''',
]
