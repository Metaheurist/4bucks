# Save 4Bucks - CI/CD
# PR / push: unit tests + secret scan + pip-audit + EXE matrix (once)
# Push to main: prepare SemVer bump → matrix pack with bumped version → release downloads artifacts only
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    name: "1 · Unit tests"
    if: |
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest tests/unit -q

  security-audit:
    name: "1 · Secret scan & dependency check"
    if: |
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Restore Gitleaks binary
        id: gitleaks-cache
        uses: actions/cache@v5
        with:
          path: gitleaks
          key: gitleaks-8.28.0-${{ runner.os }}-x64

      - name: Download Gitleaks
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          VERSION=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz
          chmod +x gitleaks

      - name: Gitleaks (secret scan)
        run: ./gitleaks detect --source . --config .gitleaks.toml --no-git --verbose --exit-code 1 --redact

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit==2.9.0"

      - name: pip-audit (runtime)
        run: python -m pip_audit -r requirements.txt

      - name: pip-audit (dev)
        run: python -m pip_audit -r requirements-dev.txt

  prepare_version:
    name: "1 · Prepare version bump"
    needs: [unit-tests, security-audit]
    if: |
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          !contains(github.event.head_commit.message, '[skip ci]')
        )
      )
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Bump patch version
        id: bump
        run: python scripts/ci/bump_version.py --write-github-output

      - name: Upload bumped __init__.py
        uses: actions/upload-artifact@v4
        with:
          name: bumped-version
          path: src/__init__.py
          if-no-files-found: error
          retention-days: 7

  build-exe:
    name: "2 · Build Windows EXE - ${{ matrix.arch }}"
    needs: [unit-tests, security-audit, prepare_version]
    if: |
      always() &&
      needs.unit-tests.result == 'success' &&
      needs.security-audit.result == 'success' &&
      (needs.prepare_version.result == 'success' || needs.prepare_version.result == 'skipped') &&
      (
        github.event_name != 'push' ||
        !contains(github.event.head_commit.message, '[skip ci]')
      )
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
          - arch: x86
    steps:
      - uses: actions/checkout@v5

      - name: Download bumped version
        if: needs.prepare_version.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: bumped-version
          path: _bumped

      - name: Apply bumped __init__.py
        if: needs.prepare_version.result == 'success'
        shell: pwsh
        run: |
          Copy-Item -Force "_bumped\__init__.py" "src\__init__.py"
          Write-Host "Applied bumped version file:"
          Get-Content "src\__init__.py" | Select-String '__version__'

      - uses: actions/setup-python@v6
        id: py
        with:
          python-version: "3.11"
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Build EXE
        shell: pwsh
        run: |
          $py = "${{ steps.py.outputs.python-path }}"
          if ("${{ matrix.arch }}" -eq "x64") {
            powershell -ExecutionPolicy Bypass -File .\build.ps1 -SkipChecks -Arch x64 -PythonX64 $py
          } else {
            powershell -ExecutionPolicy Bypass -File .\build.ps1 -SkipChecks -Arch x86 -PythonX86 $py
          }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Save4Bucks-${{ matrix.arch }}
          path: dist/Save4Bucks-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: "3 · GitHub Release"
    needs: [prepare_version, build-exe]
    if: |
      github.ref == 'refs/heads/main' &&
      needs.prepare_version.result == 'success' &&
      needs.build-exe.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          !contains(github.event.head_commit.message, '[skip ci]')
        )
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: ci-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download bumped version
        uses: actions/download-artifact@v4
        with:
          name: bumped-version
          path: _bumped

      - name: Apply bumped __init__.py for commit
        run: |
          set -euo pipefail
          cp _bumped/__init__.py src/__init__.py
          echo "Prepared version ${{ needs.prepare_version.outputs.version }}"
          grep __version__ src/__init__.py

      - name: Download EXE artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Save4Bucks-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        run: |
          set -euo pipefail
          ls -la release-assets
          test -f release-assets/Save4Bucks-x64.exe
          test -f release-assets/Save4Bucks-x86.exe

      - name: Commit version bump
        env:
          VERSION: ${{ needs.prepare_version.outputs.version }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/__init__.py
          git commit -m "chore(release): bump version to ${VERSION} [skip ci]"

          # Main may have moved during the matrix build - rebase and retry push.
          for attempt in 1 2 3 4 5 6; do
            if git push origin "HEAD:${REF}"; then
              echo "Pushed version bump on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); fetching and rebasing onto origin/${REF}..."
            git fetch origin "${REF}"
            if ! git rebase "origin/${REF}"; then
              echo "Rebase conflict - keeping bumped src/__init__.py"
              git checkout --ours -- src/__init__.py || true
              git add src/__init__.py
              GIT_EDITOR=true git rebase --continue
            fi
            sleep $((attempt * 2))
          done
          echo "Failed to push version bump after retries" >&2
          exit 1

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare_version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists on remote - skipping tag create"
          else
            git tag -a "${TAG}" -m "Save 4Bucks ${VERSION}"
            git push origin "${TAG}"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists - uploading assets with clobber"
            gh release upload "${TAG}" \
              "release-assets/Save4Bucks-x64.exe#Save4Bucks-x64.exe" \
              "release-assets/Save4Bucks-x86.exe#Save4Bucks-x86.exe" \
              --clobber
          else
            NOTES="$(printf '%s\n' \
              "## Save 4Bucks ${VERSION}" \
              "" \
              "Automated release from CI." \
              "" \
              "### Artifacts" \
              "- \`Save4Bucks-x64.exe\` - 64-bit Windows (Flet / Flutter)" \
              "- \`Save4Bucks-x86.exe\` - 32-bit Windows (Flet / Flutter)" \
              "" \
              "Close GTAIV.exe before editing saves. Supported CE save version: **57**.")"

            gh release create "${TAG}" \
              --title "Save 4Bucks ${VERSION}" \
              --notes "${NOTES}" \
              "release-assets/Save4Bucks-x64.exe#Save4Bucks-x64.exe" \
              "release-assets/Save4Bucks-x86.exe#Save4Bucks-x86.exe"
          fi
