# ---------------------------------------------------------------------------
# Security · SAST & Secret Scanning
#
# What   Gitleaks secret scan of the working tree, Bandit static analysis of the
#        Python sources, and GitHub CodeQL (security-extended queries).
# When   Every pull request, weekly (Mon 05:00 UTC), manual dispatch, and as a
#        release gate on every push to main (release.yml) - which also keeps the
#        default-branch CodeQL baseline fresh for PR comparisons.
# Gates  Any leaked secret; any Bandit finding of medium+ severity and medium+
#        confidence; CodeQL results surface under Security > Code scanning.
# Notes  Gitleaks uses --no-git so historic commits are not re-flagged; README,
#        CHANGELOG and docs/ are allowlisted for badge false positives
#        (.gitleaks.toml). Accepted Bandit findings carry an inline `# nosec`.
# Local  python -m bandit -c pyproject.toml -r src save4bucks.py scripts -ll -ii
# ---------------------------------------------------------------------------
name: "Security · SAST & Secret Scanning"

on:
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: "Secrets · Gitleaks"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Restore Gitleaks binary
        id: gitleaks-cache
        uses: actions/cache@v5
        with:
          path: gitleaks
          key: gitleaks-8.28.0-${{ runner.os }}-x64

      - name: Download Gitleaks
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          VERSION=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz
          chmod +x gitleaks

      - name: Gitleaks (working tree)
        run: ./gitleaks detect --source . --config .gitleaks.toml --no-git --verbose --exit-code 1 --redact

  bandit:
    name: "SAST · Bandit"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Bandit (pinned in requirements-dev.txt)
        run: python -m pip install "$(grep -E '^bandit==' requirements-dev.txt)"

      - name: Full report (all severities, informational)
        run: python -m bandit -c pyproject.toml -r src save4bucks.py scripts -f json -o bandit-report.json --exit-zero

      - name: Gate (medium+ severity, medium+ confidence)
        run: python -m bandit -c pyproject.toml -r src save4bucks.py scripts -ll -ii

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore
          retention-days: 30

  codeql:
    name: "SAST · CodeQL (Python)"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
